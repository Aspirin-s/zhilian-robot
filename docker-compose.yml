services:
  # Neo4j图数据库
  neo4j:
    image: neo4j:5.20
    container_name: zhilian-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - zhilian-network

  # MongoDB文档数据库
  mongodb:
    image: mongo:8
    container_name: zhilian-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - zhilian-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: zhilian-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - zhilian-network

  # MySQL数据库
  mysql:
    image: mysql:8
    container_name: zhilian-mysql
    ports:
      - "3307:3306"  # 使用 3307 端口避免冲突
    environment:
      - MYSQL_ROOT_PASSWORD=password123
      - MYSQL_DATABASE=zhilian_robot
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zhilian-network

  # 后端服务
  backend:
    build: ./backend
    container_name: zhilian-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017
      - REDIS_HOST=redis
      - MYSQL_HOST=mysql
      - MYSQL_PASSWORD=password123
      - OPENAI_API_KEY=sk-08266faa1d184709878869666545ea9a
      - OPENAI_API_BASE=https://api.deepseek.com
      - OPENAI_MODEL=deepseek-chat
    depends_on:
      - neo4j
      - mongodb
      - redis
      - mysql
    networks:
      - zhilian-network
    volumes:
      - ./backend:/app

  # 前端服务
  frontend:
    build: ./frontend
    container_name: zhilian-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - zhilian-network

volumes:
  neo4j_data:
  neo4j_logs:
  mongodb_data:
  redis_data:
  mysql_data:

networks:
  zhilian-network:
    driver: bridge
